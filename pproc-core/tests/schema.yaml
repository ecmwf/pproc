datasets:
  enfo:
    dataset_type: forecast
    unperturbed:
      type: fc
    datacubes:
      - class: od
        stream: oper
        type: fc
        time: ["0000", "1200"]
        step: &mr_steps
          - from: 0
            to: 90
            by: 1
          - from: 93
            to: 144
            by: 3
          - from: 150
            to: 360
            by: 6
        domain: g
      - class: od
        stream: wave
        type: fc
        time: ["0000", "1200"]
        step: *mr_steps
        domain: g
      - class: od
        stream: enfo
        type: pf
        members:
          start: 1
          end: 50
        time: ["0000", "1200"]
        step: *mr_steps
        domain: g
      - class: od
        stream: waef
        type: pf
        members:
          start: 1
          end: 50
        time: ["0000", "1200"]
        step: *mr_steps
        domain: g
      - class: od
        stream: oper
        type: fc
        time: ["0600", "1800"]
        step: &bc_steps
          - from: 0
            to: 90
            by: 1
          - from: 93
            to: 144
            by: 3
        domain: g
      - class: od
        stream: wave
        type: fc
        time: ["0600", "1800"]
        step: *bc_steps
        domain: g
      - class: od
        stream: enfo
        type: pf
        members:
          start: 1
          end: 50
        time: ["0600", "1800"]
        step: *bc_steps
        domain: g
      - class: od
        stream: waef
        type: pf
        members:
          start: 1
          end: 50
        time: ["0600", "1800"]
        step: *bc_steps
        domain: g
    wave:
      - stream: wave
      - stream: waef
  eefo:
    dataset_type: forecast
    unperturbed:
      type: cf
    datacubes:
      - class: od
        stream: eefo
        type: cf
        time: "0000"
        levtype: sfc
        step: &subs_steps
          - from: 0
            to: 1104
            by: 6
        domain: g
      - class: od
        stream: weef
        type: cf
        time: "0000"
        levtype: sfc
        step: *subs_steps
        domain: g
      - class: od
        stream: eefo
        type: pf
        time: "0000"
        levtype: sfc
        members:
          start: 1
          end: 100
        step: *subs_steps
        domain: g
      - class: od
        stream: weef
        type: pf
        time: "0000"
        levtype: sfc
        members:
          start: 1
          end: 100
        step: *subs_steps
        domain: g
    wave:
      - stream: weef
  seasonal:
    dataset_type: forecast
    datacubes:
      - class: od
        stream: mmsf
        type: fc
        members:
          start: 0
          end: 50
        step: &seas_steps
          - from: 0
            to: 5160
            by: 6
        domain: g
      - class: od
        stream: wasf
        type: fc
        members:
          start: 0
          end: 50
        step: *seas_steps
        domain: g
    wave:
      - stream: wasf
  enfh:
    dataset_type: reforecast
    unperturbed:
      type: cf
    datacubes:
      - stream: enfh
        type: cf
        step: &mr_hind_steps
          - from: 0
            to: 360
            by: 6
      - stream: enwh
        type: cf
        step: *mr_hind_steps
      - stream: enfh
        type: pf
        members:
          start: 1
          end: 10
        step: *mr_hind_steps
      - stream: enwh
        type: pf
        members:
          start: 1
          end: 10
        step: *mr_hind_steps
    wave:
      - stream: enwh
    scheme: ecmwf-4days
  eefh:
    dataset_type: reforecast
    unperturbed:
      type: cf
    datacubes:
      - stream: eefh
        type: cf
        step: &subs_hind_steps
          - from: 0
            to: 1104
            by: 6
      - stream: weeh
        type: cf
        step: *subs_hind_steps
      - stream: eefh
        type: pf
        members:
          start: 1
          end: 10
        step: *subs_hind_steps
      - stream: weeh
        type: pf
        members:
          start: 1
          end: 10
        step: *subs_hind_steps
    wave:
      - stream: weeh
    scheme: ecmwf-2days
  efhs-cd:
    dataset_type: climatology
    datacubes:
      - stream: efhs
        type: cd
        quantile: 100
        step: *efhs_cd_steps
      - stream: wehs
        type: cd
        quantile: 100
        step: *efhs_cd_steps
    wave:
      - stream: wehs
    scheme: ecmwf-4days
  eehs-cd:
    dataset_type: climatology
    datacubes:
      - stream: efhs
        type: cd
        quantile: 100
        step: *eehs_cd_steps
    scheme: ecmwf-4days
  efhs-em:
    dataset_type: climatology
    datacubes:
      - stream: efhs
        type: em
        step: *efhs_em_steps
      - stream: efhs
        type: es
        step: *efhs_em_steps
    scheme: ecmwf-4days
