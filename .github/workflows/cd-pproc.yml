name: Publish pproc to PyPI or TestPyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag X.Y.Z'
        required: true
        type: string
      environment:
        description: 'Publish to'
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python_version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: astral-sh/setup-uv@v7
      - name: Run pproc tests
        run: |
          cd pproc
          uv sync --python "${{ matrix.python_version }}" --all-packages
          uv run prek --directory . --config ../.pre-commit-config.yaml
          if [ -d "tests" ]; then
            uv run --prerelease allow -m tests/ -v
          fi

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python_version: ["3.11", "3.12", "3.13"]
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: |
          cd pproc
          python -m build

      - name: Check package
        run: |
          cd pproc
          twine check dist/*

      - name: Publish to Test PyPI
        if: inputs.environment == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pproc/dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.environment == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pproc/dist/
