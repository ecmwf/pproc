name: Publish pproc-core to PyPI or TestPyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag ppcore-X.Y.Z'
        required: true
        type: string
      environment:
        description: 'Publish to'
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python_version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v7
      - name: Run checks and tests
        run: |
          cd pproc-core
          uv sync --python "${{ matrix.python_version }}" --all-packages
          uv run prek --directory . --config ../.pre-commit-config.yaml
          if [ -d "tests" ]; then
            uv run -m pytest tests/ -v
          fi

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine build

      - run: |
          cd pproc-core
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
          if [ "${{ inputs.environment }}" = "testpypi" ] ; then
            TARGET="--repository testpypi"
            export TWINE_PASSWORD="$TWINE_PASSWORD_TEST"
          else
            TARGET=""
            export TWINE_PASSWORD="$TWINE_PASSWORD_PROD"
          fi
          twine upload $TARGET --verbose dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD_PROD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_PASSWORD_TEST: ${{ secrets.PYPI_TEST_API_TOKEN }}
