[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools>=78", "setuptools-scm[toml]>=9.2" ]

[project]
name = "pproc"
description = "ECMWF Post-processing tools"
readme = "README.md"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
authors = [
  { name = "European Centre for Medium-Range Weather Forecasts (ECMWF)", email = "software.support@ecmwf.int" },
]

requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]

dependencies = [
  "conflator>=0.1.7",
  "earthkit-time>=0.1.3",
  "earthkit-utils>=0.2.1",
  "filelock>=3.12",
  "numexpr",
  "pproc-core",
  "pproc-runtime",
  "psutil",
  "scikit-learn",
  "scipy>=1.8",
  "xarray",
]
optional-dependencies.tcycl = [
  "pyinfero @ git+ssh://git@github.com/ecmwf/infero.git@0.3.1#subdirectory=src/infero/api/pyinfero",
  "wget",
]
scripts.pproc-accumulate = "pproc.accumulate:main"
scripts.pproc-anomaly = "pproc.anomaly:main"
scripts.pproc-clustereps = "pproc.clustereps.__main__:main"
scripts.pproc-clustereps-attr = "pproc.clustereps.attribution:main"
scripts.pproc-clustereps-cluster = "pproc.clustereps.cluster:main"
scripts.pproc-clustereps-pca = "pproc.clustereps.pca:main"
scripts.pproc-config = "pproc.config_generation:main"
scripts.pproc-ecpoint = "pproc.ecpoint:main"
scripts.pproc-ensms = "pproc.ensms:main"
scripts.pproc-extreme = "pproc.extreme:main"
scripts.pproc-extreme-forecast-simple = "pproc.extreme_forecast_simple:main"
scripts.pproc-flight-levels = "pproc.flight_levels:main"
scripts.pproc-histogram = "pproc.histogram:main"
scripts.pproc-interpol = "pproc.interpol:main"
scripts.pproc-monthly-stats = "pproc.monthly_stats:main"
scripts.pproc-probabilities = "pproc.probabilities:main"
scripts.pproc-pts = "pproc.pts:main"
scripts.pproc-quantiles = "pproc.quantiles:main"
scripts.pproc-significance = "pproc.significance:main"
scripts.pproc-spectrum = "pproc.spectrum:main"
scripts.pproc-tcycl-evaluate = "pproc.tcycl.tcycl_evaluate:main"
scripts.pproc-tcycl-run = "pproc.tcycl.tcycl_run:main"
scripts.pproc-tcycl-summarise-ibtks = "pproc.tcycl.tcycl_summarise_ibtks:main"
scripts.pproc-tcycl-summarise-tcycl = "pproc.tcycl.tcycl_summarise_tcycl:main"
scripts.pproc-tcycl-summarise-trckr = "pproc.tcycl.tcycl_summarise_trckr:main"
scripts.pproc-thermal-indices = "pproc.thermal_indices:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "requests>=2.34.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools_scm]
write_to = "src/pproc/_version.py"
write_to_template = '''# Do not change! Do not track in version control!
__version__ = "{version}"
'''
local_scheme = "no-local-version"
scm.git.describe_command = [ 'git', 'describe', '--dirty', '--tags', '--long', '--abbrev=40', '--match', '[0-9]*' ]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [ "tests" ]

[tool.uv.sources]
pproc-core = { workspace = true }
pproc-runtime = { workspace = true }

[tool.uv.workspace]
members = [
  "../pproc-core",
  "../pproc-runtime",
]
