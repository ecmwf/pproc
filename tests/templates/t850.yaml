parameters:
  t850:
    inputs:
      fc:
        request:
          param: 130
          interpolate:
            grid: O640
            intgrid: none
            legendre-loader: shmem
            matrix-loader: file-io
      clim:
        request:
          param: 130
          interpolate:
            grid: O640
            intgrid: none
            legendre-loader: shmem
            matrix-loader: file-io
          step:
            0: 12
            12: 24
            24: 36
    accumulations:
      step:
        type: legacywindow
        windows:
        - coords: [[0], [12]]
          operation: minimum
          thresholds:
          - metadata: {"paramId": 131022}
            comparison: <
            value: -8
          metadata:
            bitsPerValue: 24
        - coords: [[0], [12]]
          operation: maximum
          thresholds:
          - metadata: {"paramId": 131025}
            comparison: '>'
            value: 8
          metadata:
            bitsPerValue: 24
        - coords: [[0, 12, 24]]
          operation: mean
          include_start: true
          thresholds:
          - metadata: {"paramId": 131020}
            comparison: <
            value: -2
          - metadata: {"paramId": 131021}
            comparison: '>='
            value: 2
          metadata:
            bitsPerValue: 24
        - coords: [[0], [12]]
          operation: maximum
          std_anomaly: true 
          thresholds:
          - metadata: {"paramId": 133093}
            comparison: '>'
            value: 1
          metadata:
            localDefinitionNumber: 30
            bitsPerValue: 24
            edition: 2
            typeOfGeneratingProcess: 5
            paramId: 0
            timeIncrement: 12
            typeOfStatisticalProcessing: 10
            packingType: grid_ccsds
        - coords: [[0], [12]]
          operation: minimum
          std_anomaly: true 
          thresholds:
          - metadata: {"paramId": 133096}
            comparison: <
            value: -1
          metadata:
            localDefinitionNumber: 30
            bitsPerValue: 24
            edition: 2
            typeOfGeneratingProcess: 5
            paramId: 0
            timeIncrement: 12
            typeOfStatisticalProcessing: 10
            packingType: grid_ccsds
inputs:
  fc:
    request:
      - class: od
        stream: enfo
        expver: '0001'
        levelist: 850
        levtype: pl
        type: cf
        domain: g
        date: 20240507
        time: 12
      - class: od
        stream: enfo
        expver: '0001'
        levelist: 850
        levtype: pl
        type: pf
        domain: g
        date: 20240507
        time: 12
        number: [1, 2, 3, 4, 5]
    source:
      type: fdb
  clim:
    request:
      - class: od
        stream: efhs
        expver: '0001'
        levelist: 850
        levtype: pl
        stream: efhs
        type: em
        date: 20240506
        domain: g
        time: 00
      - class: od
        stream: efhs
        expver: '0001'
        levelist: 850
        levtype: pl
        type: es
        date: 20240506
        domain: g
        time: 00
    source:
      type: fdb
outputs:
  default:
    metadata:
      expver: "0001"
      type: ep
      localDefinitionNumber: 5
      bitsPerValue: 8
    target:
      type: fdb